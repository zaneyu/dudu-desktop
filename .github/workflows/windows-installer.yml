name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      store_version:
        description: 'Three-part Store package version (Major.Minor.Patch)'
        required: true
        type: string

permissions:
  contents: read

# One release build per ref at a time. cancel-in-progress is false so a running build is never
# killed between upload and verification; GitHub still replaces an older *pending* run with the
# newest push, which is what we want (only the latest main is releasable).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Manual Store package runs must name their version. Pushes remain the fixed
  # 1.0.0 acceptance build and are never submission packages.
  STORE_VERSION: ${{ github.event_name == 'push' && '1.0.0' || inputs.store_version }}

jobs:
  installer:
    name: Publish + package (win-x64)
    # Do not publish a releasable installer until the complete test job is green.
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    # attestations/id-token are scoped to this job (not the workflow) so the test job
    # cannot mint provenance.
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      installer-sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # global.json pins the SDK with rollForward "disable": setup-dotnet installs exactly that
      # version and the dotnet host refuses any other, so a newer preinstalled runner SDK can
      # never be picked up silently.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install Inno Setup 7
        shell: pwsh
        run: pwsh scripts/install-inno-setup.ps1 -DownloadDirectory "$env:RUNNER_TEMP\dudu-inno"

      - name: Verify Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe missing at $iscc" }
          & $iscc /? | Select-Object -First 2

      # CI restores without lock-file generation. The Store wrapper publishes with --no-restore;
      # the Inno wrapper captures any publish-generated locks in release metadata and moves them
      # into ignored scratch before completing, so neither path leaves source lock files behind.
      - name: Restore
        run: dotnet restore DuduDesktop.slnx -p:RestorePackagesWithLockFile=false

      - name: Publish and package
        shell: pwsh
        # publish-windows.ps1 fails before ISCC.exe if the publish tree has any file outside its
        # allowlist, and writes artifacts/release-metadata/ (publish manifest with per-file
        # SHA-256, dotnet --info, transitive package list, generated lock files).
        run: pwsh scripts/publish-windows.ps1 -Version 1.0.0

      - name: Installer smoke test
        shell: pwsh
        run: pwsh tests/installer/installer-smoke.ps1 -Installer artifacts/DuduDesktop-1.0.0-win-x64-private.exe

      # tests/Dudu.UiTests (FlaUI/UI Automation) has never run in CI: every test
      # in it self-skips unless DUDU_UI_TEST_EXE is set, so it silently ran zero
      # assertions. Standard GitHub-hosted Windows runners have no interactive
      # desktop session (see "Performance gates" below), which FlaUI's UI
      # Automation driver also needs, so this is off by default. Enable it only
      # by setting the repository variable DUDU_ENABLE_UI_AUTOMATION=true on a
      # runner that has an interactive desktop; once enabled it is a real gate
      # (no continue-on-error) and its failure fails the job.
      - name: UI automation tests (FlaUI)
        if: vars.DUDU_ENABLE_UI_AUTOMATION == 'true'
        timeout-minutes: 15
        shell: pwsh
        env:
          DUDU_UI_TEST_EXE: ${{ github.workspace }}\artifacts\publish\win-x64\Dudu.App.exe
        run: dotnet test --project tests/Dudu.UiTests/Dudu.UiTests.csproj -c Release --no-restore

      - name: Performance gates (interactive Windows only)
        # Standard GitHub-hosted Windows runners have no interactive desktop session, so WinUI's
        # overlay cannot be created there. Enable this only when this job is deliberately moved to
        # an interactive Windows 11 runner; the manual acceptance run remains mandatory for release.
        if: vars.DUDU_ENABLE_INTERACTIVE_PERFORMANCE == 'true'
        timeout-minutes: 15
        shell: pwsh
        run: pwsh scripts/run-performance-gates.ps1 -Executable artifacts/publish/win-x64/Dudu.App.exe -Output artifacts/performance/release.json

      - name: Record interactive performance gate deferral
        if: vars.DUDU_ENABLE_INTERACTIVE_PERFORMANCE != 'true'
        shell: pwsh
        run: |
          @"
          ## Performance gates

          Deferred: the standard GitHub-hosted Windows runner has no interactive desktop session, so it cannot create the WinUI overlay required by the performance harness. Run `pwsh scripts/verify.ps1` on supported Windows 11 24H2 x64 before release.
          "@ >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Performance gates deferred: standard GitHub-hosted Windows runners are non-interactive."

      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash artifacts/DuduDesktop-1.0.0-win-x64-private.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  DuduDesktop-1.0.0-win-x64-private.exe" | Set-Content -NoNewline artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # GitHub only issues artifact attestations for PRIVATE repositories on GitHub Enterprise
      # Cloud; on a personal Free/Pro account this step fails. It is therefore opt-in: set the
      # repository variable DUDU_ENABLE_ATTESTATION=true only once the repo lives somewhere that
      # supports private attestations (GitHub's private Sigstore instance). Never make the repo
      # public to get it: public-repo attestations go to the public Sigstore transparency log.
      - name: Attest build provenance
        id: attest
        if: vars.DUDU_ENABLE_ATTESTATION == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: artifacts/DuduDesktop-1.0.0-win-x64-private.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DuduDesktop-1.0.0-win-x64-private
          path: |
            artifacts/DuduDesktop-1.0.0-win-x64-private.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DuduDesktop-1.0.0-release-metadata
          path: artifacts/release-metadata/
          if-no-files-found: error
          retention-days: 90

  store-package:
    name: Package private Store MSIX (win-x64)
    # This is a non-public, manually retrieved package only. The local manifest
    # identity is deliberately non-production, so this job does not submit to
    # Partner Center or claim that the artifact is Store-publishable. The Store
    # artifact is acceptance-only: never upload it to Partner Center.
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        # The Store wrapper publishes with --no-restore; explicitly restore
        # the self-contained win-x64 runtime pack that publish needs.
        run: dotnet restore DuduDesktop.slnx -r win-x64 -p:RestorePackagesWithLockFile=false
      - name: Package private Store MSIX
        id: package_store
        shell: pwsh
        # GitHub-hosted Windows has no interactive desktop, so this can only
        # produce a local-identity acceptance artifact. It is not a submission
        # build and must never be uploaded to Partner Center.
        run: pwsh scripts/package-store.ps1 -Version $env:STORE_VERSION -AcceptanceOnly
      - name: Record Store package failure metadata
        if: ${{ always() && steps.package_store.outcome == 'failure' }}
        shell: pwsh
        run: |
          $failureMetadataDirectory = 'artifacts/store-package-failure-metadata'
          New-Item -ItemType Directory -Path $failureMetadataDirectory -Force | Out-Null
          @"
          Store package step failed before completion.
          WACK status: not completed; inspect validation-summary.txt or appcert-report.xml when present.
          This diagnostic artifact is acceptance-only and contains no package payload.
          "@ | Set-Content -LiteralPath "$failureMetadataDirectory/failure-metadata.txt" -Encoding utf8
      - name: Upload Store package failure evidence
        if: ${{ always() && steps.package_store.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DuduDesktop-${{ env.STORE_VERSION }}-win-x64-store-failure-evidence
          path: |
            artifacts/store-package-metadata/validation-summary.txt
            artifacts/store-package-metadata/appcert-report.xml
            work/store-package-failures/**/validation-summary.txt
            artifacts/store-package-failure-metadata/failure-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record acceptance-only Store package status and checksum
        shell: pwsh
        run: |
          $checksum = Get-Content -Raw artifacts/store-package-metadata/SHA256SUMS.txt
          $hash = ($checksum -split '\s+')[0]
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'Store package metadata does not contain a valid SHA-256 hash.' }
          $validationSummary = Get-Content -Raw artifacts/store-package-metadata/validation-summary.txt
          if ($validationSummary -notmatch 'Windows App Certification Kit status: skipped \(acceptance-only mode; not valid for Partner Center submission\)\.') {
            throw 'Hosted Store package metadata does not record the required acceptance-only WACK omission.'
          }
          @"
          ## Store package integrity

          Package version: $($env:STORE_VERSION).0

          WACK status: skipped — acceptance-only hosted artifact; WACK did not run and this package must never be uploaded to Partner Center.

          Store package SHA-256: $hash
          "@ >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DuduDesktop-${{ env.STORE_VERSION }}-win-x64-store
          # publish/ and unpacked/ are package-store.ps1's intermediate build/validation
          # trees under store-package-metadata/, not release evidence; uploading them
          # exhausted this repository's Actions storage quota. publish/ is also the only
          # place the PDBs matching the shipped Store MSIX live, so re-include just those
          # after the broader exclusion (upload-artifact evaluates path patterns in order,
          # so this include must come after the exclusion it overrides).
          path: |
            artifacts/store-package/
            artifacts/store-package-metadata/
            !artifacts/store-package-metadata/publish/**
            !artifacts/store-package-metadata/unpacked/**
            artifacts/store-package-metadata/publish/**/*.pdb
          if-no-files-found: error
          retention-days: 30

  verify-artifact:
    name: Verify uploaded installer + publish checksum
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Fresh runner, no checkout, no build tools: recompute the hash from the artifact as GitHub
      # stored it and require it to equal the hash the build job computed. Only then is the hash
      # written to the run summary, which stays readable independently of the artifact bundle
      # (and after the artifact's 30-day retention expires).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DuduDesktop-1.0.0-win-x64-private
          path: downloaded
      - name: Compare checksums and write run summary
        env:
          BUILD_SHA256: ${{ needs.installer.outputs.installer-sha256 }}
        run: |
          set -euo pipefail
          cd downloaded
          actual=$(sha256sum DuduDesktop-1.0.0-win-x64-private.exe | cut -d' ' -f1)
          manifest=$(cut -d' ' -f1 SHA256SUMS.txt)
          if [ "$actual" != "$BUILD_SHA256" ] || [ "$manifest" != "$BUILD_SHA256" ]; then
            echo "::error::Installer hash mismatch (build=$BUILD_SHA256 artifact=$actual SHA256SUMS=$manifest)"
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt
          {
            echo "## DuduDesktop-1.0.0-win-x64-private.exe"
            echo
            echo "SHA-256 (build job, re-verified from the stored artifact):"
            echo
            echo "\`$actual\`"
            echo
            echo "Compare the hash the recipient computes (\`Get-FileHash -Algorithm SHA256\`) against this value, not only against the SHA256SUMS.txt shipped inside the artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Windows and relay test suite
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      # Two separate steps: a pwsh `run:` block only surfaces the LAST
      # command's exit code, so a failure in the first script here would
      # never fail the step if they stayed combined.
      - name: Release source contract
        shell: pwsh
        run: pwsh tests/scripts/release-contract.tests.ps1
      - name: Store package source contract
        shell: pwsh
        run: pwsh tests/scripts/store-package.tests.ps1
      - run: dotnet restore DuduDesktop.slnx -p:RestorePackagesWithLockFile=false
      - run: dotnet build DuduDesktop.slnx -c Release --no-restore
      # One step per project with its own timeout so a hang names its project
      # and still leaves the other suites' results visible.
      # Every step runs even after an earlier one fails (if: always()) so one
      # red suite never hides another; the job itself still fails.
      # --long-running names any test still running after 60 s in the log,
      # which is the only way a hang identifies itself under a step timeout.
      - name: Dudu.Core.Tests
        run: dotnet test --project tests/Dudu.Core.Tests/Dudu.Core.Tests.csproj -c Release --no-build -- --long-running 60 --xunit-info
        timeout-minutes: 10
      - name: Dudu.Infrastructure.Tests
        if: always()
        run: dotnet test --project tests/Dudu.Infrastructure.Tests/Dudu.Infrastructure.Tests.csproj -c Release --no-build -- --long-running 60 --xunit-info
        timeout-minutes: 10
      - name: Dudu.App.Tests
        id: dudu_app_tests
        if: always()
        run: dotnet test --project tests/Dudu.App.Tests/Dudu.App.Tests.csproj -c Release --no-build -- --long-running 60 --xunit-info
        timeout-minutes: 4
      # Runs only when the Dudu.App.Tests step above (not an earlier, unrelated
      # step) did not finish: one dotnet test per class, then per method inside
      # any class that hangs, so the hung test is named in the log (xunit's
      # --long-running never printed anything).
      - name: Dudu.App.Tests (find hung tests)
        if: ${{ always() && (steps.dudu_app_tests.outcome == 'failure' || steps.dudu_app_tests.outcome == 'cancelled') }}
        run: pwsh scripts/find-hung-tests.ps1 -Project tests/Dudu.App.Tests/Dudu.App.Tests.csproj -TimeoutSeconds 90
        timeout-minutes: 25
      # Split the same way as the dotnet suites above and for the same
      # reason: a pwsh `run:` block only surfaces the LAST command's exit
      # code, so a failed earlier command here would never fail the step.
      - name: Relay dependencies
        if: always()
        working-directory: relay
        run: npm ci
      - name: Relay typecheck
        if: always()
        working-directory: relay
        run: npm run typecheck
      - name: Relay unit tests
        if: always()
        working-directory: relay
        run: npm test -- --run
      - name: Relay Playwright browsers
        if: always()
        working-directory: relay
        run: npx playwright install chromium firefox webkit
      - name: Relay browser E2E
        if: always()
        working-directory: relay
        run: npm run test:e2e
