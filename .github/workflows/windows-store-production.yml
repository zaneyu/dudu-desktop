name: Production Store MSIX

on:
  workflow_dispatch:
    inputs:
      store_version:
        description: 'Three-part Store package version (Major.Minor.Patch)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-store-msix-${{ github.ref }}
  cancel-in-progress: false

env:
  STORE_VERSION: ${{ inputs.store_version }}

jobs:
  # Mirrors the `tests` job in windows-installer.yml: the production package
  # must not be built from a source tree that hasn't passed the same source
  # contracts and test suites the ordinary CI build requires.
  tests:
    name: Windows and relay test suite
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      # Two separate steps: a pwsh `run:` block only surfaces the LAST
      # command's exit code.
      - name: Release source contract
        shell: pwsh
        run: pwsh tests/scripts/release-contract.tests.ps1
      - name: Store package source contract
        shell: pwsh
        run: pwsh tests/scripts/store-package.tests.ps1
      - run: dotnet restore DuduDesktop.slnx -p:RestorePackagesWithLockFile=false
      - run: dotnet build DuduDesktop.slnx -c Release --no-restore
      # One step per project with its own timeout so a hang names its project
      # and still leaves the other suites' results visible.
      # Every step runs even after an earlier one fails (if: always()) so one
      # red suite never hides another; the job itself still fails.
      # --long-running names any test still running after 60 s in the log,
      # which is the only way a hang identifies itself under a step timeout.
      - name: Dudu.Core.Tests
        run: dotnet test --project tests/Dudu.Core.Tests/Dudu.Core.Tests.csproj -c Release --no-build -- --long-running 60 --xunit-info
        timeout-minutes: 10
      - name: Dudu.Infrastructure.Tests
        if: always()
        run: dotnet test --project tests/Dudu.Infrastructure.Tests/Dudu.Infrastructure.Tests.csproj -c Release --no-build -- --long-running 60 --xunit-info
        timeout-minutes: 10
      - name: Dudu.App.Tests
        id: dudu_app_tests
        if: always()
        run: dotnet test --project tests/Dudu.App.Tests/Dudu.App.Tests.csproj -c Release --no-build -- --long-running 60 --xunit-info
        timeout-minutes: 4
      # Runs only when the Dudu.App.Tests step above (not an earlier, unrelated
      # step) failed or was cancelled (i.e. did not finish): one dotnet test
      # per class, then per method inside any class that hangs, so the hung
      # test is named in the log (xunit's --long-running never printed
      # anything).
      - name: Dudu.App.Tests (find hung tests)
        if: ${{ always() && (steps.dudu_app_tests.outcome == 'failure' || steps.dudu_app_tests.outcome == 'cancelled') }}
        run: pwsh scripts/find-hung-tests.ps1 -Project tests/Dudu.App.Tests/Dudu.App.Tests.csproj -TimeoutSeconds 90
        timeout-minutes: 25
      - name: Relay dependencies
        if: always()
        working-directory: relay
        run: npm ci
      - name: Relay typecheck
        if: always()
        working-directory: relay
        run: npm run typecheck
      - name: Relay unit tests
        if: always()
        working-directory: relay
        run: npm test -- --run
      - name: Relay Playwright browsers
        if: always()
        working-directory: relay
        run: npx playwright install chromium firefox webkit
      - name: Relay browser E2E
        if: always()
        working-directory: relay
        run: npm run test:e2e

  production-store-package:
    name: Build production Store MSIX (win-x64)
    # This is a deliberate free-tier trial on GitHub's Windows x64 image. The
    # package script still requires an actual WACK PASS before an artifact is
    # accepted. If the hosted image cannot provide WACK's active user session,
    # move this job back to the documented self-hosted Windows runner.
    needs: tests
    runs-on: windows-latest
    environment: microsoft-store-production
    timeout-minutes: 90
    permissions:
      # write is needed only to create the private draft release that carries
      # the production package (see the last step).
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Verify production runner
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Production Store packaging requires Windows.' }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Production Store packaging requires an x64 Windows runner.' }
          if (-not [Environment]::Is64BitProcess) { throw 'Production Store packaging requires 64-bit PowerShell.' }
          if ([Environment]::OSVersion.Version.Build -lt 26100) { throw 'Production Store packaging requires Windows build 26100 or newer.' }
          if ((dotnet --version) -ne '10.0.112') { throw 'The runner must provide .NET SDK 10.0.112.' }

      - name: Restore
        shell: pwsh
        run: dotnet restore DuduDesktop.slnx -r win-x64 -p:RestorePackagesWithLockFile=false

      - name: Apply Partner Center identity in the ephemeral worktree
        shell: pwsh
        env:
          PARTNER_CENTER_NAME: ${{ secrets.DUDU_STORE_PARTNER_CENTER_NAME }}
          PARTNER_CENTER_PUBLISHER: ${{ secrets.DUDU_STORE_PARTNER_CENTER_PUBLISHER }}
          PARTNER_CENTER_PUBLISHER_DISPLAY_NAME: ${{ secrets.DUDU_STORE_PARTNER_CENTER_PUBLISHER_DISPLAY_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_NAME) -or
              [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_PUBLISHER) -or
              [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_PUBLISHER_DISPLAY_NAME)) {
            throw 'The microsoft-store-production environment is missing one or more Partner Center identity secrets.'
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'src/Dudu.App/Package.appxmanifest'
          [xml]$manifest = Get-Content -Raw -LiteralPath $manifestPath
          $identity = $manifest.Package.Identity
          $properties = $manifest.Package.Properties
          if ($null -eq $identity -or $null -eq $properties) {
            throw 'The app manifest is missing Identity or Properties.'
          }

          # These values exist only in the ephemeral runner checkout. They are
          # never committed, uploaded as source, or written to the job summary.
          $identity.Name = $env:PARTNER_CENTER_NAME
          $identity.Publisher = $env:PARTNER_CENTER_PUBLISHER
          $properties.PublisherDisplayName = $env:PARTNER_CENTER_PUBLISHER_DISPLAY_NAME
          $manifest.Save($manifestPath)

      - name: Build and validate production Store package
        shell: pwsh
        env:
          PARTNER_CENTER_NAME: ${{ secrets.DUDU_STORE_PARTNER_CENTER_NAME }}
          PARTNER_CENTER_PUBLISHER: ${{ secrets.DUDU_STORE_PARTNER_CENTER_PUBLISHER }}
        run: |
          pwsh scripts/package-store.ps1 `
            -Version $env:STORE_VERSION `
            -RequirePartnerCenterIdentity `
            -ExpectedPartnerCenterName $env:PARTNER_CENTER_NAME `
            -ExpectedPartnerCenterPublisher $env:PARTNER_CENTER_PUBLISHER

      - name: Upload Store diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DuduDesktop-${{ inputs.store_version }}-win-x64-store-diagnostics
          # publish/ and unpacked/ are package-store.ps1's intermediate build/validation
          # trees under store-package-metadata/, not diagnostic evidence; uploading them
          # exhausted this repository's Actions storage quota. publish/ is also the only
          # place the PDBs matching the shipped Store MSIX live, so re-include just those
          # after the broader exclusion (upload-artifact evaluates path patterns in order,
          # so this include must come after the exclusion it overrides).
          path: |
            artifacts/store-package-metadata/
            artifacts/store-package/
            !artifacts/store-package-metadata/publish/**
            !artifacts/store-package-metadata/unpacked/**
            artifacts/store-package-metadata/publish/**/*.pdb
          if-no-files-found: warn
          retention-days: 7

      - name: Write package checksum to the job summary
        shell: pwsh
        run: |
          $checksum = Get-Content -Raw artifacts/store-package-metadata/SHA256SUMS.txt
          $validation = Get-Content -Raw artifacts/store-package-metadata/validation-summary.txt
          if ($validation -notmatch 'Windows App Certification Kit report: Store-ready') {
            throw 'The production package did not record a Store-ready Windows App Certification Kit report.'
          }
          @"
          ## Production Store package

          Version: $($env:STORE_VERSION).0

          $checksum
          WACK: Store-ready; optional informational warnings, if any, are retained in the metadata.

          The package is not submitted automatically. Upload it to the matching
          private Partner Center submission only after reviewing the package.
          "@ >> $env:GITHUB_STEP_SUMMARY

      # The production package is attached to a draft GitHub Release instead of
      # an Actions artifact: artifact storage is metered against the account's
      # monthly quota and a spent quota blocked this upload outright, while
      # release assets are not metered. The draft is never published, so in this
      # private repository only people with write access can see it. Unlike the
      # artifact it never expires: delete it once the Store update is live. The zip keeps
      # the artifact's layout (store-package/ and store-package-metadata/) and
      # leaves out package-store.ps1's bulky publish/ and unpacked/ intermediate
      # trees, except the PDBs matching the shipped MSIX.
      - name: Attach the production package to a private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "DuduDesktop-$($env:STORE_VERSION)-win-x64-production-store"
          $staging = Join-Path $env:RUNNER_TEMP $name
          $metadata = Join-Path $env:GITHUB_WORKSPACE 'artifacts/store-package-metadata'
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Recurse -LiteralPath artifacts/store-package -Destination (Join-Path $staging 'store-package')
          $stagedMetadata = Join-Path $staging 'store-package-metadata'
          New-Item -ItemType Directory -Path $stagedMetadata | Out-Null
          Get-ChildItem -LiteralPath $metadata -Force |
            Where-Object { $_.Name -notin @('publish', 'unpacked') } |
            Copy-Item -Recurse -Destination $stagedMetadata
          $publish = Join-Path $metadata 'publish'
          if (Test-Path -LiteralPath $publish) {
            foreach ($pdb in Get-ChildItem -LiteralPath $publish -Recurse -File -Filter *.pdb) {
              $target = Join-Path $stagedMetadata (Join-Path 'publish' ([IO.Path]::GetRelativePath($publish, $pdb.FullName)))
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
              Copy-Item -LiteralPath $pdb.FullName -Destination $target
            }
          }
          if (@(Get-ChildItem -LiteralPath (Join-Path $staging 'store-package') -Recurse -File -Filter *.msix).Count -ne 1) {
            throw 'Expected exactly one production .msix to attach to the draft release.'
          }

          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          # ZipFile (not Compress-Archive) guarantees forward-slash entry names, so
          # the zip unpacks into real directories on macOS and Linux.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($staging, $zip)
          $tag = "store-production-$($env:STORE_VERSION)-run$($env:GITHUB_RUN_ID)"
          # The run id is stable across re-run attempts. Remove a draft left behind
          # by an earlier attempt of this same run so the tag names one release.
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw 'Removing the earlier draft release for this run failed.' }
          }
          gh release create $tag $zip `
            --repo $env:GITHUB_REPOSITORY `
            --draft `
            --target $env:GITHUB_SHA `
            --title "Production Store package $($env:STORE_VERSION) (private draft - never publish)" `
            --notes "Private production Store MSIX from run $($env:GITHUB_RUN_ID). Keep this release a draft; delete it once the Store update is live."
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
          "Private draft release: ``$tag`` (asset ``$name.zip``)" >> $env:GITHUB_STEP_SUMMARY
